<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login </title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
     <div class="container"> 
     <!-- 1. DEFAULT FIRST LOOK: USER SIGN IN FORM -->
        <div id="user-signin-box" class="form-box active">
            <h2>User Portal</h2>
            <p class="subtitle"> Sign in to your personal dashboard account workspace </p>
          <div class="input-group">   
    <input type="email" placeholder="Enter Email Address" id="email">
    <input type="text" placeholder="Enter Password " id="password">
    </div> 

    <button id="login">login</button>
    <a href="./signup.html">don't have an account ? </a>
</div>
</div>


    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
    <script>
        import 'dotenv/config'; // Ya require('dotenv').config()

const firebaseConfig = {
  apiKey: process.env.FIREBASE_API_KEY,
  authDomain: process.env.FIREBASE_AUTH_DOMAIN,
  databaseURL: process.env.FIREBASE_DATABASE_URL,
  projectId: process.env.FIREBASE_PROJECT_ID,
  storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
  messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
  appId: process.env.FIREBASE_APP_ID,
  measurementId: process.env.FIREBASE_MEASUREMENT_ID
};

        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="login.js"></script>

</body>

</html>
