<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
<style >
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background-color: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 300px;
    }

    h2 {
        text-align: center;
        margin-bottom: 1rem;
    }

    .input-group {
        margin-bottom: 1rem;
    }

    input[type="email"],
    input[type="text"],
    input[type="file"] {
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.5rem;
        border-radius: 4px;
        border: 1px solid #ccc;
    }

    button {
        width: 100%;
        padding: 0.5rem;
        background-color: #007BFF;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: #007BFF;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

</style>

<body>
    <div class="container"> 
     <!-- 1. DEFAULT FIRST LOOK: USER SIGN IN FORM -->
        <div id="user-signin-box" class="form-box active">
            <h2>User Portal</h2>
            <p class="subtitle">Sign in to your personal dashboard account workspace</p>
            <form onsubmit="handleAuth(event, 'dashboard.html')">
        
                <div class="input-group">
                <input type="file" id="imageupload" accept="image/*">
                <!-- <button id="unclick">Upload</button> -->
                    </div>

                    <div class="input-group">
                    <input type="email" placeholder="Enter Email Address" id="email">
                    <input type="text" placeholder="Enter Password " id="password">
                    </div>
                        <button id="signup"> SignUp </button>
                        <a href="./login.html">Already Account ? </a>
    <div class="admin-divider">
                <span class="admin-link" onclick="switchForm('admin-signin-box')">System Manager? Access Admin Portal →</span>
    <a href="./Admin-side/admin.html">Admin </a>
            </div>
